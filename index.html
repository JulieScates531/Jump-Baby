<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Jump Baby">
  <title>Jump Baby – Chores & Training</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1 id="title">My Day</h1>
      <div class="points-pill" id="pointsPill" title="Points to spend">⭐ <span id="pointsBalance">0</span></div>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabs" role="tablist">
    <button data-tab="today" class="active"><span>✅</span>Today</button>
    <button data-tab="rewards"><span>🎁</span>Rewards</button>
    <button data-tab="history"><span>📅</span>History</button>
    <button data-tab="parent"><span>🔒</span>Parent</button>
  </nav>

  <div id="toast" class="toast" hidden></div>
  <div id="celebrate" class="celebrate" aria-hidden="true"></div>

  <script src="app.js"></script>
</body>
</html>
